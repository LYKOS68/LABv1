<!doctype html>
<html lang="de">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Rap-Lab — Türsteher</title><link rel="stylesheet" href="/style.css"></head>
  <body>
    <main>
      <p class="eyebrow">RAP-LAB / ENTRY 01</p>
      <h1>Der Türsteher<br>kennt deinen Beat.</h1>
      <p class="lede">Registriere dich oder zeig deinen Pass. Nach dem Check bekommst du deinen Studio-Token.</p>
      <section class="gate">
        <div class="tabs"><button class="active" data-mode="register">Registrieren</button><button data-mode="login">Login</button></div>
        <form id="auth-form"><label>Alias<input id="username" autocomplete="username" minlength="3" required placeholder="nightwriter"></label><label>Passwort<input id="password" type="password" autocomplete="new-password" minlength="10" required placeholder="mindestens 10 Zeichen"></label><button class="enter" type="submit">Einlass prüfen <span>→</span></button></form>
        <p id="message" role="status"></p>
      </section>
      <section id="studio" hidden><p class="eyebrow">STUDIO UNLOCKED</p><h2>Willkommen, <span id="artist"></span>.</h2><p>Dein geheimer Token:</p><code id="token"></code><button id="copy">Token kopieren</button><p class="warning">Bewahre ihn privat auf. Er wird nur jetzt vollständig angezeigt.</p></section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
